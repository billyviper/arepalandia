<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arepalandia Publica</title>
<meta name="theme-color" content="#1d3a8a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--azul:#1d3a8a;--amarillo:#f6c624;--rojo:#c8202f;--fondo:#fbf5e8;--tarjeta:#ffffff;--texto:#1b1b1b;--suave:#5c5c5c;--borde:#e6dcc6;--ok:#1e7a3c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4}
header{background:var(--azul);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.35rem;letter-spacing:.5px}
header h1 span{color:var(--amarillo)}
header p{margin:4px 0 0;font-size:.9rem;opacity:.9}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h2{font-size:1.15rem;margin:22px 0 10px;color:var(--azul)}
.vacio{background:var(--tarjeta);border:1px dashed var(--borde);border-radius:14px;padding:18px;text-align:center;color:var(--suave)}
.card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.hecha{opacity:.55}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;margin-bottom:6px}
.chip{background:#eef2fb;color:var(--azul);border-radius:999px;padding:3px 10px;font-weight:600}
.chip.hora{background:#fff4d1;color:#7a5a00}
.chip.atrasada{background:#fde8ea;color:var(--rojo)}
.card h3{margin:4px 0 10px;font-size:1.1rem}
.paso{display:flex;gap:10px;align-items:flex-start;margin:12px 0 6px}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--amarillo);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.paso p{margin:2px 0 0}
.texto{white-space:pre-wrap;background:#faf7f0;border:1px solid var(--borde);border-radius:10px;padding:12px;font-size:.95rem;width:100%;font-family:inherit;color:inherit;min-height:120px;resize:vertical}
.foto-prev{width:100%;border-radius:10px;margin-top:8px;display:none;max-height:320px;object-fit:cover;background:#000}
button,.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 14px;font-size:1.05rem;font-weight:700;margin-top:10px;cursor:pointer;font-family:inherit;text-align:center}
.b-azul{background:var(--azul);color:#fff}
.b-amarillo{background:var(--amarillo);color:#000}
.b-verde{background:var(--ok);color:#fff}
.b-gris{background:#ece6d8;color:#333}
.fila{display:flex;gap:10px}
.fila>*{flex:1}
input[type=file]{display:none}
.pedidos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pedidos button{margin:0;padding:18px 6px;font-size:1rem}
.pedidos b{display:block;font-size:1.6rem}
.resp{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:10px}
.resp p{margin:4px 0 0;font-size:.95rem;color:var(--suave)}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:999px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.aviso.ver{opacity:.95}
details summary{cursor:pointer;color:var(--azul);font-weight:600;margin:6px 0}
footer{text-align:center;color:var(--suave);font-size:.8rem;margin-top:30px}
</style>
</head>
<body>
<header>
  <h1>AREPA<span>LANDIA</span> · Publicar</h1>
  <p id="sub">Cargando…</p>
</header>
<main>
  <button id="instalar" class="b-amarillo" style="display:none">📲 Instalar la app en este celular</button>
  <section>
    <h2>Hoy toca publicar</h2>
    <div id="hoy"></div>
  </section>

  <section>
    <h2>Pedidos de hoy</h2>
    <p style="margin:0 0 10px;color:var(--suave);font-size:.95rem">Cuando entra un pedido, toca de dónde vino.</p>
    <div class="pedidos">
      <button class="b-gris" data-fuente="instagram">Instagram<b id="c-instagram">0</b></button>
      <button class="b-gris" data-fuente="whatsapp">WhatsApp<b id="c-whatsapp">0</b></button>
      <button class="b-gris" data-fuente="otro">Otro<b id="c-otro">0</b></button>
    </div>
    <div class="fila">
      <button class="b-gris" id="deshacer">Deshacer último</button>
      <button class="b-verde" id="resumen">Mandar resumen a Billy</button>
    </div>
  </section>

  <section>
    <h2>Lo que viene</h2>
    <div id="proximas"></div>
  </section>

  <section>
    <h2>Respuestas rápidas</h2>
    <div id="respuestas"></div>
  </section>
  <footer id="pie"></footer>
</main>
<div class="aviso" id="aviso"></div>

<script>
const $ = s => document.querySelector(s);
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let plan = null;
const fotos = {};

function aviso(t){ const a=$('#aviso'); a.textContent=t; a.classList.add('ver'); clearTimeout(a._t); a._t=setTimeout(()=>a.classList.remove('ver'),2200); }

function fechaLarga(iso){
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('es-UY',{weekday:'long',day:'numeric',month:'long'});
}

function textoDe(p){ return leer('texto-'+p.id, null) ?? p.texto; }
function hecha(id){ return leer('hechas', []).includes(id); }

async function copiar(t){
  try { await navigator.clipboard.writeText(t); aviso('Texto copiado ✔'); }
  catch { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); aviso('Texto copiado ✔'); }
}

async function compartir(p){
  const t = textoDe(p);
  let f = fotos[p.id];
  await copiar(t);
  if (!f && p.imagen) {
    try { const b = await (await fetch(p.imagen)).blob(); f = new File([b], p.imagen.split('/').pop(), {type: b.type || 'image/jpeg'}); } catch {}
  }
  if (f && navigator.canShare && navigator.canShare({files:[f]})) {
    try { await navigator.share({files:[f], text:t}); return; } catch(e){ if (e.name==='AbortError') return; }
  }
  if (navigator.share) {
    try { await navigator.share({text:t}); return; } catch(e){ if (e.name==='AbortError') return; }
  }
  if (p.donde.includes('Instagram')) location.href='https://www.instagram.com/';
  else location.href='https://wa.me/?text='+encodeURIComponent(t);
}

function tarjeta(p, atrasada){
  const el = document.createElement('div');
  el.className = 'card' + (hecha(p.id) ? ' hecha' : '');
  el.innerHTML = `
    <div class="meta"><span class="chip">${p.donde}</span><span class="chip hora">${p.hora} h</span>${atrasada?'<span class="chip atrasada">Quedó pendiente</span>':''}</div>
    <h3></h3>
    <div class="paso"><div class="num">1</div><p class="foto-txt"></p></div>
    <label class="btn b-amarillo">📷 Sacar foto o video<input type="file" accept="image/*,video/*" capture="environment"></label>
    <label class="btn b-gris">🖼️ Elegir de la galería<input type="file" accept="image/*,video/*"></label>
    <img class="foto-prev" alt="Foto elegida">
    <a class="btn b-gris bajar" download style="display:none;text-decoration:none">⬇️ Guardar la pieza en el celular</a>
    <div class="paso"><div class="num">2</div><p>Este es el texto. Puedes cambiarlo si quieres.</p></div>
    <textarea class="texto"></textarea>
    <div class="paso"><div class="num">3</div><p>Toca compartir y elige ${p.donde.includes('Instagram')?'Instagram':'WhatsApp'}. El texto ya queda copiado: si no aparece, mantén apretado y pega.</p></div>
    <button class="b-azul compartir">Compartir</button>
    <div class="fila"><button class="b-gris copiar">Copiar texto</button><button class="b-verde listo">${hecha(p.id)?'Publicado ✔':'Ya lo publiqué'}</button></div>`;
  el.querySelector('h3').textContent = p.titulo;
  el.querySelector('.foto-txt').textContent = p.foto;
  if (p.imagen && !fotos[p.id]) {
    const img = el.querySelector('.foto-prev'); img.src = p.imagen; img.style.display = 'block'; img.style.maxHeight = 'none'; img.style.objectFit = 'contain';
    const a = el.querySelector('.bajar'); a.href = p.imagen; a.setAttribute('download', p.imagen.split('/').pop()); a.style.display = 'block';
  }
  const ta = el.querySelector('.texto'); ta.value = textoDe(p);
  ta.addEventListener('input', () => guardar('texto-'+p.id, ta.value));
  el.querySelectorAll('input[type=file]').forEach(inp => inp.addEventListener('change', () => {
    const f = inp.files[0]; if (!f) return;
    fotos[p.id] = f;
    const img = el.querySelector('.foto-prev');
    if (f.type.startsWith('image/')) { img.src = URL.createObjectURL(f); img.style.display='block'; }
    aviso('Foto lista ✔');
  }));
  el.querySelector('.copiar').onclick = () => copiar(textoDe(p));
  el.querySelector('.compartir').onclick = () => compartir(p);
  el.querySelector('.listo').onclick = () => {
    const h = leer('hechas', []);
    if (!h.includes(p.id)) { h.push(p.id); guardar('hechas', h); aviso('¡Bien! Publicación marcada'); }
    pintar();
  };
  return el;
}

function pintar(){
  const hoy = hoyISO();
  const pubs = plan.publicaciones;
  const deHoy = pubs.filter(p => p.fecha === hoy);
  const atrasadas = pubs.filter(p => p.fecha < hoy && !hecha(p.id)).slice(-2);
  const cont = $('#hoy'); cont.innerHTML='';
  atrasadas.forEach(p => cont.appendChild(tarjeta(p,true)));
  deHoy.forEach(p => cont.appendChild(tarjeta(p,false)));
  if (!cont.children.length) cont.innerHTML = `<div class="vacio">Hoy no hay publicaciones. ¡Descansa! 🙌</div>`;
  const prox = pubs.filter(p => p.fecha > hoy).slice(0,4);
  const pc = $('#proximas'); pc.innerHTML='';
  if (!prox.length) pc.innerHTML = `<div class="vacio">El plan de la semana que viene llega el lunes.</div>`;
  prox.forEach(p => { const d=document.createElement('div'); d.className='resp'; d.innerHTML='<b></b><p></p>'; d.querySelector('b').textContent = fechaLarga(p.fecha)+' · '+p.hora+' h'; d.querySelector('p').textContent = p.donde+': '+p.titulo; pc.appendChild(d); });
  pintarPedidos();
}

function pedidosHoy(){ return leer('pedidos-'+hoyISO(), {instagram:0, whatsapp:0, otro:0, log:[]}); }
function pintarPedidos(){ const c = pedidosHoy(); ['instagram','whatsapp','otro'].forEach(k => $('#c-'+k).textContent = c[k]); }
document.querySelectorAll('[data-fuente]').forEach(b => b.onclick = () => {
  const c = pedidosHoy(); const k = b.dataset.fuente; c[k]++; c.log.push(k); guardar('pedidos-'+hoyISO(), c); pintarPedidos(); aviso('Pedido anotado ✔');
});
$('#deshacer').onclick = () => { const c = pedidosHoy(); const k = c.log.pop(); if (k) { c[k]--; guardar('pedidos-'+hoyISO(), c); pintarPedidos(); aviso('Listo, lo saqué'); } };
$('#resumen').onclick = () => {
  const lineas = [];
  let tot = {instagram:0, whatsapp:0, otro:0};
  for (let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); const iso=d.toISOString().slice(0,10); const c=leer('pedidos-'+iso,null); if(c){ ['instagram','whatsapp','otro'].forEach(k=>tot[k]+=c[k]); lineas.push(`${fechaLarga(iso)}: IG ${c.instagram}, WA ${c.whatsapp}, otro ${c.otro}`);} }
  const pubs = plan.publicaciones.filter(p => hecha(p.id)).length;
  const msg = `Resumen Arepalandia (últimos 7 días)\nPedidos: Instagram ${tot.instagram}, WhatsApp ${tot.whatsapp}, otro ${tot.otro}\nPublicaciones hechas: ${pubs} de ${plan.publicaciones.length}\n\n${lineas.join('\n')}`;
  location.href = 'https://wa.me/?text=' + encodeURIComponent(msg);
};

function pintarRespuestas(){
  const r = $('#respuestas'); r.innerHTML='';
  (plan.respuestas||[]).forEach(x => { const d=document.createElement('div'); d.className='resp'; d.innerHTML='<b></b><p></p><button class="b-gris">Copiar</button>'; d.querySelector('b').textContent=x.titulo; d.querySelector('p').textContent=x.texto; d.querySelector('button').onclick=()=>copiar(x.texto); r.appendChild(d); });
}

async function iniciar(){
  try {
    const res = await fetch('plan.json?v=' + Date.now(), {cache:'no-store'});
    plan = await res.json(); guardar('plan', plan);
  } catch { plan = leer('plan', null); }
  if (!plan) { $('#hoy').innerHTML = '<div class="vacio">No se pudo cargar el plan. Revisa el internet y vuelve a abrir.</div>'; return; }
  $('#sub').textContent = fechaLarga(hoyISO()).replace(/^./, c => c.toUpperCase());
  $('#pie').textContent = 'Plan de la semana: ' + plan.semana + (plan.promo ? ' · Promo: ' + plan.promo : '');
  pintar(); pintarRespuestas();
}
iniciar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
let pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; $('#instalar').style.display = 'block'; });
$('#instalar').addEventListener('click', async () => {
  if (!pedidoInstalar) return;
  pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar = null; $('#instalar').style.display = 'none';
});
window.addEventListener('appinstalled', () => { $('#instalar').style.display = 'none'; });
</script>
</body>
</html>
